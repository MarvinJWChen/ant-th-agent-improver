[project]
name = "agent-improver"
version = "0.1.0"
description = "Production-trace-driven agent improvement with side-effect-safe counterfactual replay"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
